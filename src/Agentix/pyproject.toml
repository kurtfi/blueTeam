[project]
name = "agentix"
version = "0.1.0"
description = "Tool-First AI Orchestration Platform"
requires-python = ">=3.12"

dependencies = [
    "agentic-common",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "asyncio-throttle>=1.0.2",
    "ollama>=0.6.1",
    "google-genai>=1.68.0",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "sse-starlette>=3.3.3",
    "redis>=7.4.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "motor>=3.6.0",
    "elasticsearch>=8.15.0",
    "neo4j>=5.25.0",
    "fastmcp>=3.2.0",
    "docling>=2.84.0",
    "crawl4ai>=0.8.6",
    "playwright>=1.58.0",
    "langfuse<3.0.0",
    "tiktoken>=0.12.0",
    "yfinance>=0.2.40",
    "arxiv>=2.1.0",
    "tavily-python>=0.3.5",
    "PyYAML>=6.0.1",
    "firebase-admin>=6.5.0",
    "aiofiles>=23.2.1",
]

[tool.uv.sources]
agentic-common = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
