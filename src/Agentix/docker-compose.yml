services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentix-postgres
    networks:
      - agentix_net
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: agentix
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentix_db
    restart: always

  langfuse-db:
    image: postgres:16
    container_name: langfuse-postgres
    networks:
      - agentix_net
    restart: always
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse-password
      - POSTGRES_DB=langfuse
    ports:
      - "25433:5432"
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    networks:
      - agentix_net
    depends_on:
      - langfuse-db
    restart: always
    ports:
      - "3010:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse-password@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3010
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-my-secret}
      - SALT=${SALT:-my-salt}
      - TELEMETRY_ENABLED=false

  redis:
    image: redis:7-alpine
    container_name: agentix-redis
    networks:
      - agentix_net
    restart: always
    ports:
      - "26379:6379"

  general-mcp:
    build:
      context: ../..
      dockerfile: src/GeneralMCP/Dockerfile
    container_name: agentix-general-mcp
    networks:
      - agentix_net
    restart: always
    ports:
      - "8080:8080"
    environment:
      - FASTMCP_TRANSPORT=sse
      - FASTMCP_PORT=8080
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_WORKSPACE_ROOT=/app
      - REDIS_URL=redis://redis:6379
      - AGENTIX_POSTGRES_URL=postgresql+asyncpg://agentix:password@postgres:5432/agentix_db
      - WAZUH_API_URL=https://wazuh-manager:55000
      - WAZUH_API_VERIFY_SSL=false
      - CORTEX_URL=http://cortex:9001
      - THEHIVE_URL=http://thehive:9000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LANGFUSE_HOST=http://langfuse:3000
    env_file:
      - .env
    volumes:
      - ../..:/app
      - /app/.venv

  soc-mcp:
    build:
      context: ../..
      dockerfile: src/SOCMCP/Dockerfile
    container_name: agentix-soc-mcp
    networks:
      - agentix_net
    restart: always
    ports:
      - "8081:8081"
    environment:
      - FASTMCP_TRANSPORT=sse
      - FASTMCP_PORT=8081
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_WORKSPACE_ROOT=/app
      - REDIS_URL=redis://redis:6379
      - WAZUH_API_URL=https://wazuh-manager:55000
      - WAZUH_API_VERIFY_SSL=false
      - CORTEX_URL=http://cortex:9001
      - THEHIVE_URL=http://thehive:9000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LANGFUSE_HOST=http://langfuse:3000
    env_file:
      - .env
    volumes:
      - ../..:/app
      - /app/.venv

  agentix-api:
    build:
      context: ../..
      dockerfile: src/Agentix/Dockerfile
    container_name: agentix-api
    networks:
      - agentix_net
    restart: always
    environment:
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_GENERAL_MCP_URL=http://general-mcp:8080/sse
      - AGENTIX_SOC_MCP_URL=http://soc-mcp:8081/sse
      - REDIS_URL=redis://redis:6379
      - AGENTIX_POSTGRES_URL=postgresql+asyncpg://agentix:password@postgres:5432/agentix_db
      - WAZUH_API_URL=https://wazuh-manager:55000
      - WAZUH_API_VERIFY_SSL=false
      - CORTEX_URL=http://cortex:9001
      - THEHIVE_URL=http://thehive:9000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LANGFUSE_HOST=http://langfuse:3000
    env_file:
      - .env
    volumes:
      - ../..:/app
      - /app/.venv
    command: [ "uv", "run", "uvicorn", "agentix.api.server:app", "--host", "0.0.0.0", "--port", "8000" ]
    depends_on:
      - general-mcp
      - soc-mcp
      - redis
      - postgres

  agentix-gateway:
    build:
      context: ../..
      dockerfile: src/Agentix/Dockerfile
    container_name: agentix-gateway
    networks:
      - agentix_net
    restart: always
    ports:
      - "8001:8001"
    environment:
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_API_URL=http://agentix-api:8000
    env_file:
      - .env
    volumes:
      - ../..:/app
      - /app/.venv
    command: [ "uv", "run", "uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8001" ]
    depends_on:
      - agentix-api

  agentix-scheduler:
    build:
      context: ../..
      dockerfile: src/Agentix/Dockerfile
    container_name: agentix-scheduler
    networks:
      - agentix_net
    restart: always
    environment:
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_API_URL=http://agentix-api:8000
      - LANGFUSE_HOST=http://langfuse:3000
    env_file:
      - .env
    volumes:
      - ../..:/app
      - /app/.venv
    command: [ "uv", "run", "python", "-m", "scheduler.main" ]
    depends_on:
      - agentix-api

networks:
  agentix_net:
    name: agentix_net
    external: true

volumes:
  langfuse_db_data:

