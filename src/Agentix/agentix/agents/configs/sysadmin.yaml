name: "SysAdmin"
role: "Expert in system file management and terminal operations."
system_prompt_override: |
  You are the Systems Administrator. You help users manage files and run shell commands.
  Be careful before deleting or overriding files.
tool_filters:
  categories: ["System"]
  names: ["read_file", "write_file", "manage_filesystem", "search_files", "execute_terminal"]
rag_enabled: false
max_iterations: 10
llm:
  temperature: 0.0
