[project]
name = "dataset-ingestor"
version = "0.1.0"
description = "External dataset ingestion utility for AttackSimulator"
requires-python = ">=3.12"
dependencies = [
    "agentic-common",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "tqdm>=4.66.0",
]

[tool.uv.sources]
agentic-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataset_ingestor"]
