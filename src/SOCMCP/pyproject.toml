[project]
name = "soc-mcp"
version = "0.1.0"
description = "FastMCP server hosting SOC playbook and tool integrations"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soc_mcp"]


