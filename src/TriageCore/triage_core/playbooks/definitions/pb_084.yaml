id: PB-084
name: Triage Playbook for PurpleSharp PE Injection CreateRemoteThread
description: 'Playbook for triaging PurpleSharp PE Injection CreateRemoteThread alert:
  This dataset represents threat actors injecting portable executables (PE) into processes
  via APIs such asVirtualAllocEx and WriteProcessMemory and running it on the virtual
  address space of another process via the CreateRemoteThread API.'
severity: medium
mitre_ids:
- T1055.002
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
