id: PB-033
name: Triage Playbook for Empire DCSync
description: 'Playbook for triaging Empire DCSync alert: This dataset represents adversaries
  abusing Active Directory Replication services to retrieve secret domain data (i.e.
  NTLM hashes) from domain accounts.'
severity: medium
mitre_ids:
- T1003.006
- T1003.001
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
