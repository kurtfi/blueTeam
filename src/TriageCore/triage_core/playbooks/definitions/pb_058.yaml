id: PB-058
name: Triage Playbook for Empire Regsvr32 Execution
description: 'Playbook for triaging Empire Regsvr32 Execution alert: This dataset
  represents threat actors leveraging regsvr32 to proxy the execution of an empire
  payload (.sct file) to create a reverse connection to the C2.'
severity: medium
mitre_ids:
- T1003.001
- T1218.010
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
