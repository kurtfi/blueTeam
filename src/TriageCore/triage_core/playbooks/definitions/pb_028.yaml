id: PB-028
name: Triage Playbook for Covenant Wuauclt CreateRemoteThread Execution
description: 'Playbook for triaging Covenant Wuauclt CreateRemoteThread Execution
  alert: This dataset represents adversaries proxy executing code via the Windows
  Update client utility. In order to bypass rules looking for the binary reaching
  out directly to the Internet, this dataset shows the binary creating and running
  a thread in the virtual address space of another process via the CreateRemoteThread
  API.'
severity: medium
mitre_ids:
- T1218
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
