id: PB-017
name: Triage Playbook for Covenant Remote DCOM Iertutil DLL Hijacking
description: 'Playbook for triaging Covenant Remote DCOM Iertutil DLL Hijacking alert:
  This dataset represents adversaries abusing a DLL hijack vulnerability found in
  the execution of the DCOM InternetExplorer.Application class for lateral movement.'
severity: medium
mitre_ids:
- T1003.001
- T1021.003
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
