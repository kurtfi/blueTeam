id: PB-009
name: Triage Playbook for AWS Cloud Bank Breach S3
description: 'Playbook for triaging AWS Cloud Bank Breach S3 alert: This dataset represents
  adversaries abusing a misconfigured EC2 reverse proxy to obtain instance profile
  keys and eventually exfiltrate files from an S3 bucket.'
severity: medium
mitre_ids:
- T1078.004
- T1530
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
