id: PB-018
name: Triage Playbook for Covenant Remote File Copy
description: 'Playbook for triaging Covenant Remote File Copy alert: This dataset
  represents a threat actor remotely copying a file over SMB (CreateRequest).'
severity: medium
mitre_ids:
- T1021.002
tags:
- wazuh-rule-100010
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
