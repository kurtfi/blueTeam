id: PB-096
name: Triage Playbook for WMIC Remote XSL Jscript Execution
description: 'Playbook for triaging WMIC Remote XSL Jscript Execution alert: This
  dataset represents adversaries proxy executing code and bypassing application controls
  by leveraging wmic and the `/FORMAT` argument switch to download and execute an
  XSL file (jscript).'
severity: medium
mitre_ids:
- T1220
- T1003.001
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
