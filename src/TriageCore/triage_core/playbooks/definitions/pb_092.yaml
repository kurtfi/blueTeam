id: PB-092
name: Triage Playbook for Seatbelt Group User Discovery
description: 'Playbook for triaging Seatbelt Group User Discovery alert: This dataset
  represents a threat actor using Seatbelt profiling an endpoint. This specifically
  uses the -group=user command.'
severity: medium
mitre_ids:
- T1003.001
- T1012
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
