id: PB-094
name: Triage Playbook for UI Prompt For Credentials Function
description: 'Playbook for triaging UI Prompt For Credentials Function alert: This
  dataset represents adversaries leveraging functions such as CredUIPromptForCredentials
  to create and display a configurable dialog box that accepts credentials information
  from a user.'
severity: medium
mitre_ids:
- T1056.002
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
