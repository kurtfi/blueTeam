id: PB-038
name: Triage Playbook for Empire Find Local Admin Access
description: 'Playbook for triaging Empire Find Local Admin Access alert: This dataset
  represents adversaries using the OpenSCManagerW Win32API call to establish a handle
  to the remote host and verify if the current user context has local administrator
  acess to the target.'
severity: medium
mitre_ids:
- T1003.001
- T1069.001
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
