id: PB-012
name: Triage Playbook for CMSTP Proxy Execution
description: 'Playbook for triaging CMSTP Proxy Execution alert: This dataset represents
  threat actors leveraging CMSTP to execute an Inf file to proxy execute other malicious
  commands (i.e. cmd.exe). (Embedding commands in the RunPreSetupCommandsSection of
  the INF file).'
severity: medium
mitre_ids:
- T1218.003
steps:
- order: 1
  title: Search for related SIEM logs
  group: analysis
  description: Retrieve SIEM logs related to the MITRE techniques to understand event
    scope.
  tool_hint: query_siem_logs
- order: 2
  title: Confirm verdict
  group: analysis
  description: Determine if the alert is a True Positive or False Positive.
  approval_gate:
    message: Please confirm if this is a True Positive
    requires_confirmation_for: 'VERDICT: TRUE_POSITIVE'
