[project]
name = "integration-tests"
version = "0.1.0"
description = "Scenario and E2E integration tests for Agentix"
requires-python = ">=3.12"
dependencies = [
    "agentix",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agentix = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["integration_tests"]


