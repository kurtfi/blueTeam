[project]
name = "attack-simulator"
version = "0.1.0"
description = "MITRE ATT&CK simulation framework for Agentix"
requires-python = ">=3.12"
dependencies = [
    "agentic-common",
    "triagecore",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "fastmcp>=3.2.0",
    "tqdm>=4.66.0",
]

[tool.uv.sources]
agentic-common = { workspace = true }
triagecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attack_simulator"]
