name: "agentix"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentix-postgres
    networks:
      - agentix_net
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: agentix
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentix_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  langfuse-db:
    image: postgres:16
    container_name: langfuse-postgres
    networks:
      - agentix_net
    restart: always
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse-password
      - POSTGRES_DB=langfuse
    ports:
      - "25433:5432"
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    networks:
      - agentix_net
    depends_on:
      - langfuse-db
    restart: always
    ports:
      - "3010:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse-password@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3010
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-my-secret}
      - SALT=${SALT:-my-salt}
      - TELEMETRY_ENABLED=false

  redis:
    image: redis:7-alpine
    container_name: agentix-redis
    networks:
      - agentix_net
    restart: always
    ports:
      - "26379:6379"

  triage-core:
    build:
      context: ..
      dockerfile: src/TriageCore/Dockerfile
    container_name: triage-core
    networks:
      - agentix_net
    restart: always
    ports:
      - "8081:8081"
    environment:
      - FASTMCP_TRANSPORT=sse
      - FASTMCP_PORT=8081
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_WORKSPACE_ROOT=/app
      - REDIS_URL=redis://redis:6379
      - WAZUH_API_URL=https://wazuh-manager:55000
      - WAZUH_API_VERIFY_SSL=false
      - CORTEX_URL=http://cortex:9001
      - THEHIVE_URL=http://thehive:9000
      - LANGFUSE_HOST=http://langfuse:3000
    env_file:
      - TriageCore/.env
    volumes:
      - ..:/app
      - /app/.venv
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/sse')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  agentix-api:
    build:
      context: ..
      dockerfile: src/Agentix/Dockerfile
    container_name: agentix-api
    networks:
      - agentix_net
    restart: always
    environment:
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_TRIAGE_CORE_URL=http://triage-core:8081/sse
      - AGENTIX_ATTACK_SIMULATOR_URL=http://attack-simulator:8082/sse
      - AGENTIX_ATTACK_SIMULATOR_API_URL=http://attack-simulator:8083
      - REDIS_URL=redis://redis:6379
      - AGENTIX_POSTGRES_URL=postgresql+asyncpg://agentix:password@postgres:5432/agentix_db
      - WAZUH_API_URL=https://wazuh-manager:55000
      - WAZUH_API_VERIFY_SSL=false
      - CORTEX_URL=http://cortex:9001
      - THEHIVE_URL=http://thehive:9000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LANGFUSE_HOST=http://langfuse:3000
      - AGENTIX_WEBHOOK_URL=http://localhost:8000/v1/webhooks/simulation
    env_file:
      - Agentix/.env
    volumes:
      - ..:/app
      - /app/.venv
    command: [ "uv", "run", "uvicorn", "agentix.api.server:app", "--host", "0.0.0.0", "--port", "8000" ]
    depends_on:
      triage-core:
        condition: service_healthy
      attack-simulator:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started

  attack-simulator:
    build:
      context: ..
      dockerfile: src/AttackSimulator/Dockerfile
    container_name: attack-simulator
    networks:
      - agentix_net
    restart: always
    ports:
      - "8082:8082"
      - "8083:8083"
    environment:
      - FASTMCP_TRANSPORT=sse
      - FASTMCP_PORT=8082
      - AGENTIX_LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379
      - ATTACK_SIMULATOR_DATABASE_URL=postgresql://agentix:password@postgres:5432/agentix_db
      - AGENTIX_WEBHOOK_URL=http://agentix-api:8000/v1/webhooks/simulation
    volumes:
      - ..:/app
      - /app/.venv
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/sse')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  agentix-gateway:
    build:
      context: ..
      dockerfile: src/Agentix/Dockerfile
    container_name: agentix-gateway
    networks:
      - agentix_net
    restart: always
    ports:
      - "8001:8001"
    environment:
      - AGENTIX_LOG_LEVEL=DEBUG
      - AGENTIX_API_URL=http://agentix-api:8000
      - AGENTIX_POSTGRES_URL=postgresql+asyncpg://agentix:password@postgres:5432/agentix_db
    env_file:
      - Agentix/.env
    volumes:
      - ..:/app
      - /app/.venv
    command: [ "uv", "run", "uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8001" ]
    depends_on:
      - agentix-api


networks:
  agentix_net:
    name: agentix_net
    external: true

volumes:
  langfuse_db_data:
  postgres_data:

