[tool.uv]
workspace = { members = ["src/Agentix", "src/TriageCore", "src/AgenticCommon", "src/AttackSimulator"] }

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "langfuse.*",
    "asyncpg.*",
    "pgvector.*"
]
ignore_missing_imports = true
